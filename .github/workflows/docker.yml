name: Docker

on:
  push:
    branches: [main, setup/docker]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: cd backend && mvn clean package -DskipTests

      - name: Get project version
        id: version
        run: echo "VERSION=$(cd backend && mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image for backend
        uses: docker/build-push-action@v5 # Build and push Docker image
        with:
          context: ./backend
          push: true
          tags: ghcr.io/albin5223/bank-account:${{ steps.version.outputs.VERSION }}
          build-args: VERSION=${{ steps.version.outputs.VERSION }}